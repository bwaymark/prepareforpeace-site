<section class="contact" id="contact">
  <h2>Get in touch</h2>
  <p>If you would like to contribute, share what your community is already doing, or just say hello, send a message below.</p>

  <form id="contact-form" novalidate>
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" autocomplete="name" required maxlength="200">

    <label for="email">Your email</label>
    <input type="email" id="email" name="email" autocomplete="email" required maxlength="200">

    <label for="message">Message</label>
    <textarea id="message" name="message" required maxlength="5000"></textarea>

    <!-- Honeypot: hidden from people, often filled in by bots -->
    <div class="hp" aria-hidden="true">
      <label for="website">Leave this empty</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="cf-turnstile" data-sitekey="{{ site.turnstile_sitekey }}"></div>

    <p class="consent">We will only use your details to reply to you. See our <a href="{{ '/privacy/' | relative_url }}">privacy notice</a>.</p>

    <button type="submit">Send message</button>
    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
  </form>
</section>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script>
(function () {
  var form = document.getElementById('contact-form');
  var status = document.getElementById('form-status');
  var button = form.querySelector('button');
  var endpoint = "{{ site.form_endpoint }}";

  function show(msg, isError) {
    status.textContent = msg;
    status.className = 'form-status' + (isError ? ' error' : '');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var data = new FormData(form);

    if (!data.get('name') || !data.get('email') || !data.get('message')) {
      show('Please fill in your name, email and message.', true);
      return;
    }
    if (!data.get('cf-turnstile-response')) {
      show('Please complete the security check.', true);
      return;
    }

    button.disabled = true;
    show('Sending…', false);

    fetch(endpoint, { method: 'POST', body: new URLSearchParams(data) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          form.reset();
          show('Thank you. Your message has been sent and we will reply soon.', false);
        } else {
          show(res.error || 'Something went wrong. Please try again, or email {{ site.contact_email }}.', true);
        }
      })
      .catch(function () {
        show('Something went wrong. Please try again, or email {{ site.contact_email }}.', true);
      })
      .finally(function () {
        button.disabled = false;
        if (window.turnstile) { window.turnstile.reset(); }
      });
  });
})();
</script>
