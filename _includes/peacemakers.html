  <h2>Peacemakers on every channel</h2>
  <p>In a crisis, fear spreads fast, and so do rumours, blame and calls to strike back. Every network, from a street noticeboard to a radio channel, needs calm people who check facts, correct rumours and refuse to join in the blame game. <a href="{{ '/radio/#peacemakers-on-every-channel' | relative_url }}">Why this matters</a>.</p>
